<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f2440"/>
    </linearGradient>
    <linearGradient id="redGradDos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glowDos">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDos">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgDos)"/>

  <!-- Grid background -->
  <g stroke="#1e40af" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="560" y1="0" x2="560" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
  </g>

  <!-- Target Server (center) -->
  <g filter="url(#shadowDos)" transform="translate(320, 155)">
    <rect x="0" y="0" width="160" height="140" rx="10" fill="url(#serverGrad)" stroke="#1e40af" stroke-width="2"/>
    <!-- Server rack lines -->
    <rect x="12" y="15" width="136" height="22" rx="4" fill="#0f2440" stroke="#2563eb" stroke-width="1"/>
    <circle cx="28" cy="26" r="5" fill="#22c55e" filter="url(#glowDos)"/>
    <rect x="40" y="22" width="80" height="8" rx="2" fill="#1e3a5f"/>
    <rect x="12" y="45" width="136" height="22" rx="4" fill="#0f2440" stroke="#2563eb" stroke-width="1"/>
    <circle cx="28" cy="56" r="5" fill="#22c55e" filter="url(#glowDos)"/>
    <rect x="40" y="52" width="80" height="8" rx="2" fill="#1e3a5f"/>
    <rect x="12" y="75" width="136" height="22" rx="4" fill="#0f2440" stroke="#2563eb" stroke-width="1"/>
    <circle cx="28" cy="86" r="5" fill="#ef4444" filter="url(#glowDos)"/>
    <rect x="40" y="82" width="80" height="8" rx="2" fill="#1e3a5f"/>
    <!-- Server label -->
    <text x="80" y="128" text-anchor="middle" font-size="13" fill="#60a5fa" font-family="Arial" font-weight="bold">TARGET SERVER</text>
  </g>

  <!-- Overload warning on server -->
  <g transform="translate(360, 220)" filter="url(#glowDos)">
    <circle cx="60" cy="60" r="30" fill="#dc2626" opacity="0.9"/>
    <text x="60" y="55" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold" font-family="Arial">!</text>
    <text x="60" y="75" text-anchor="middle" font-size="10" fill="#fff" font-family="Arial" font-weight="bold">DOWN</text>
  </g>

  <!-- Attacking bots / zombies (left side) -->
  <!-- Bot 1 -->
  <g transform="translate(30, 80)" filter="url(#shadowDos)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#111827"/>
    <circle cx="20" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="35" y="52" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">BOT</text>
  </g>
  <!-- Bot 2 -->
  <g transform="translate(30, 185)" filter="url(#shadowDos)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#111827"/>
    <circle cx="20" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="35" y="52" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">BOT</text>
  </g>
  <!-- Bot 3 -->
  <g transform="translate(30, 290)" filter="url(#shadowDos)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#111827"/>
    <circle cx="20" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="35" y="52" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">BOT</text>
  </g>

  <!-- Attacking bots (right side) -->
  <g transform="translate(700, 80)" filter="url(#shadowDos)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#111827"/>
    <circle cx="20" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="35" y="52" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">BOT</text>
  </g>
  <g transform="translate(700, 185)" filter="url(#shadowDos)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#111827"/>
    <circle cx="20" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="35" y="52" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">BOT</text>
  </g>
  <g transform="translate(700, 290)" filter="url(#shadowDos)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#111827"/>
    <circle cx="20" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="35" y="52" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">BOT</text>
  </g>

  <!-- Flood arrows from left bots -->
  <g fill="#ef4444" filter="url(#glowDos)" opacity="0.9">
    <!-- from bot1 -->
    <polygon points="100,105 290,195 100,135" fill="#ef4444" opacity="0.6"/>
    <line x1="100" y1="107" x2="315" y2="210" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="100" y1="130" x2="315" y2="225" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,4"/>
    <!-- from bot2 -->
    <line x1="100" y1="207" x2="315" y2="230" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <!-- from bot3 -->
    <line x1="100" y1="315" x2="315" y2="250" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="100" y1="330" x2="315" y2="260" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,4"/>
  </g>

  <!-- Flood arrows from right bots -->
  <g fill="#ef4444" filter="url(#glowDos)" opacity="0.9">
    <line x1="700" y1="107" x2="490" y2="210" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="700" y1="130" x2="490" y2="225" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="700" y1="207" x2="490" y2="230" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="700" y1="315" x2="490" y2="250" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="700" y1="330" x2="490" y2="260" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,4"/>
  </g>

  <!-- REQUEST FLOOD labels on arrows -->
  <text x="195" y="175" text-anchor="middle" font-size="9" fill="#fca5a5" font-family="Arial" font-weight="bold" transform="rotate(-18, 195, 175)">FLOOD!</text>
  <text x="590" y="175" text-anchor="middle" font-size="9" fill="#fca5a5" font-family="Arial" font-weight="bold" transform="rotate(18, 590, 175)">FLOOD!</text>

  <!-- Top label -->
  <rect x="250" y="20" width="300" height="40" rx="10" fill="#7f1d1d" opacity="0.9"/>
  <text x="400" y="37" text-anchor="middle" font-size="13" fill="#fff" font-family="Arial" font-weight="bold">⚠ DDoS ATTACK IN PROGRESS</text>
  <text x="400" y="53" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">Thousands of bots flood the server simultaneously</text>

  <!-- Bottom status bar -->
  <rect x="200" y="380" width="400" height="45" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#a5b4fc" font-family="Arial" font-weight="bold">🌐 Target Website: OFFLINE</text>
  <text x="400" y="418" text-anchor="middle" font-size="10" fill="#c4b5fd" font-family="Arial">Legitimate users cannot connect — service disrupted</text>

  <!-- Bottom bar -->
  <rect x="0" y="432" width="800" height="18" fill="#7f1d1d" opacity="0.85"/>
  <text x="400" y="445" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial" font-weight="bold">🚫 DDoS attacks are a criminal offence under IT Act 2000 • Report: cybercrime.gov.in • 1930</text>
</svg>

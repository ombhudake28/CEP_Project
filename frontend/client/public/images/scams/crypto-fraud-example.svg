<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgCrEx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <linearGradient id="msgSentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="msgRecvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <filter id="glowCrEx">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowCrEx">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgCrEx)"/>

  <!-- Phone mockup -->
  <rect x="230" y="20" width="340" height="410" rx="30" fill="#1f2937" filter="url(#shadowCrEx)" stroke="#374151" stroke-width="1.5"/>
  <rect x="238" y="28" width="324" height="394" rx="24" fill="#0a0a18"/>
  <!-- Notch -->
  <rect x="330" y="28" width="140" height="22" rx="0" fill="#1f2937"/>
  <rect x="368" y="34" width="64" height="10" rx="5" fill="#0a0a18"/>

  <!-- Chat header -->
  <rect x="246" y="58" width="308" height="46" rx="8" fill="#1a1a2e"/>
  <circle cx="270" cy="81" r="16" fill="#f59e0b"/>
  <text x="270" y="87" text-anchor="middle" font-size="14" fill="#78350f" font-weight="bold" font-family="Arial">₿</text>
  <text x="296" y="75" font-size="11" fill="#fff" font-family="Arial" font-weight="bold">CryptoKing_Investments</text>
  <text x="296" y="91" font-size="9" fill="#22c55e" font-family="Arial">● Online • 10,342 members</text>

  <!-- Chat messages -->
  <!-- Scammer msg 1 -->
  <rect x="250" y="116" width="250" height="42" rx="10" fill="url(#msgRecvGrad)"/>
  <polygon points="250,122 240,116 250,130" fill="#1e3a5f"/>
  <text x="258" y="132" font-size="9.5" fill="#bfdbfe" font-family="Arial">🚀 EARN 10X in 30 days! Invest</text>
  <text x="258" y="148" font-size="9.5" fill="#bfdbfe" font-family="Arial">BTC now! Guaranteed 1000% ROI!</text>

  <!-- Scammer msg 2 -->
  <rect x="250" y="168" width="280" height="42" rx="10" fill="url(#msgRecvGrad)"/>
  <text x="258" y="184" font-size="9.5" fill="#bfdbfe" font-family="Arial">💎 Proof of profits 👇 Join our</text>
  <text x="258" y="200" font-size="9.5" fill="#bfdbfe" font-family="Arial">VIP group — only 3 spots left!</text>

  <!-- Victim response -->
  <rect x="280" y="220" width="260" height="30" rx="10" fill="url(#msgSentGrad)"/>
  <polygon points="540,224 550,218 540,236" fill="#166534"/>
  <text x="288" y="239" font-size="9.5" fill="#bbf7d0" font-family="Arial">OK I'm interested. How do I invest?</text>

  <!-- Scammer msg 3 -->
  <rect x="250" y="260" width="280" height="54" rx="10" fill="url(#msgRecvGrad)"/>
  <text x="258" y="276" font-size="9.5" fill="#bfdbfe" font-family="Arial">Send 0.05 BTC to this wallet:</text>
  <text x="258" y="292" font-size="9" fill="#93c5fd" font-family="monospace">bc1qxy2kgdygjrsqtzq2n0yrf24...</text>
  <text x="258" y="307" font-size="9.5" fill="#bfdbfe" font-family="Arial">Profits sent back in 7 days!</text>

  <!-- Warning annotation over wallet address -->
  <rect x="246" y="286" width="308" height="18" rx="4" fill="#ef4444" opacity="0.25"/>
  <line x1="542" y1="292" x2="590" y2="260" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" filter="url(#glowCrEx)"/>
  <rect x="590" y="240" width="160" height="30" rx="8" fill="#ef4444" opacity="0.9"/>
  <text x="670" y="253" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">⚠ Untraceable wallet!</text>
  <text x="670" y="265" text-anchor="middle" font-size="9" fill="#fecaca" font-family="Arial">Money cannot be recovered</text>

  <!-- Victim sends money -->
  <rect x="280" y="324" width="260" height="30" rx="10" fill="url(#msgSentGrad)"/>
  <polygon points="540,328 550,322 540,340" fill="#166534"/>
  <text x="288" y="343" font-size="9.5" fill="#bbf7d0" font-family="Arial">Done! Sent 0.05 BTC 🤞</text>

  <!-- Scammer disappears -->
  <rect x="250" y="364" width="210" height="30" rx="10" fill="#374151" opacity="0.6"/>
  <text x="258" y="383" font-size="9.5" fill="#9ca3af" font-family="Arial" font-style="italic">This user has left the chat</text>

  <!-- Left annotation -->
  <line x1="228" y1="135" x2="195" y2="118" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" filter="url(#glowCrEx)"/>
  <rect x="20" y="98" width="175" height="38" rx="8" fill="#78350f" opacity="0.9"/>
  <text x="107" y="113" text-anchor="middle" font-size="9.5" fill="#fde68a" font-family="Arial" font-weight="bold">⚠ "Guaranteed returns"</text>
  <text x="107" y="128" text-anchor="middle" font-size="9.5" fill="#fde68a" font-family="Arial">= Always a scam signal</text>

  <line x1="228" y1="385" x2="195" y2="380" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" filter="url(#glowCrEx)"/>
  <rect x="20" y="360" width="175" height="38" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="107" y="375" text-anchor="middle" font-size="9.5" fill="#fca5a5" font-family="Arial" font-weight="bold">⚠ Scammer vanishes!</text>
  <text x="107" y="390" text-anchor="middle" font-size="9.5" fill="#fca5a5" font-family="Arial">Victim loses all funds</text>

  <!-- Bottom bar -->
  <rect x="0" y="427" width="800" height="23" fill="#14532d" opacity="0.9"/>
  <text x="400" y="443" text-anchor="middle" font-size="10" fill="#86efac" font-family="Arial" font-weight="bold">⚠ Real scenario: Victims lose ₹10,000–₹50,00,000+ to crypto fraud groups on Telegram/WhatsApp</text>
</svg>

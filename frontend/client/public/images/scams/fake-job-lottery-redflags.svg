<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgRF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="50%" style="stop-color:#2d1515"/>
      <stop offset="100%" style="stop-color:#1a0a0a"/>
    </linearGradient>
    <linearGradient id="cardRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f1d1d"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <filter id="glowRF">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgRF)"/>

  <!-- Decorative dots -->
  <g fill="#ef4444" opacity="0.1">
    <circle cx="50" cy="60" r="3"/><circle cx="150" cy="30" r="2"/><circle cx="700" cy="50" r="3"/>
    <circle cx="760" cy="120" r="2"/><circle cx="30" cy="200" r="2"/><circle cx="780" cy="300" r="3"/>
    <circle cx="100" cy="400" r="2"/><circle cx="720" cy="420" r="2"/>
  </g>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="22" fill="#ef4444" font-family="Arial" font-weight="bold" filter="url(#glowRF)">⚠ RED FLAGS — Fake Job &amp; Lottery Scams</text>
  <line x1="100" y1="55" x2="700" y2="55" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>

  <!-- Card 1: Pay to Get Money -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="75" width="220" height="155" rx="14" fill="url(#cardRed)"/>
    <rect x="30" y="75" width="220" height="6" rx="14 14 0 0" fill="#ef4444"/>
    <text x="140" y="120" text-anchor="middle" font-size="38" fill="#fff">💸</text>
    <text x="140" y="150" text-anchor="middle" font-size="12" fill="#ffddd" font-family="Arial" font-weight="bold" fill="#fff">Pay to Get Money</text>
    <text x="140" y="168" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">Asked for "registration" or</text>
    <text x="140" y="182" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">"processing" fees first</text>
    <text x="140" y="220" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial" font-weight="bold">INSTANT RED FLAG!</text>
  </g>

  <!-- Card 2: Lottery Never Entered -->
  <g filter="url(#cardShadow)">
    <rect x="290" y="75" width="220" height="155" rx="14" fill="url(#cardRed)"/>
    <rect x="290" y="75" width="220" height="6" rx="14 14 0 0" fill="#ef4444"/>
    <text x="400" y="120" text-anchor="middle" font-size="38" fill="#fff">🎰</text>
    <text x="400" y="150" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial" font-weight="bold">Lottery Never Entered</text>
    <text x="400" y="168" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">Selected for a draw you</text>
    <text x="400" y="182" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">never participated in</text>
    <text x="400" y="220" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial" font-weight="bold">IMPOSSIBLE! SCAM!</text>
  </g>

  <!-- Card 3: Unrealistic Returns -->
  <g filter="url(#cardShadow)">
    <rect x="550" y="75" width="220" height="155" rx="14" fill="url(#cardOrange)"/>
    <rect x="550" y="75" width="220" height="6" rx="14 14 0 0" fill="#f59e0b"/>
    <text x="660" y="120" text-anchor="middle" font-size="38" fill="#fff">📈</text>
    <text x="660" y="150" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial" font-weight="bold">Unrealistic Earnings</text>
    <text x="660" y="168" text-anchor="middle" font-size="10" fill="#fde68a" font-family="Arial">"₹10,000/day for just</text>
    <text x="660" y="182" text-anchor="middle" font-size="10" fill="#fde68a" font-family="Arial">1 hour simple tasks!"</text>
    <text x="660" y="220" text-anchor="middle" font-size="9" fill="#f59e0b" font-family="Arial" font-weight="bold">TOO GOOD TO BE TRUE!</text>
  </g>

  <!-- Card 4: Unofficial Contact -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="255" width="220" height="155" rx="14" fill="url(#cardOrange)"/>
    <rect x="30" y="255" width="220" height="6" rx="14 14 0 0" fill="#f59e0b"/>
    <text x="140" y="300" text-anchor="middle" font-size="38" fill="#fff">📧</text>
    <text x="140" y="330" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial" font-weight="bold">Unofficial Channels</text>
    <text x="140" y="348" text-anchor="middle" font-size="10" fill="#fde68a" font-family="Arial">Job offers via WhatsApp</text>
    <text x="140" y="362" text-anchor="middle" font-size="10" fill="#fde68a" font-family="Arial">from Gmail/Yahoo accounts</text>
    <text x="140" y="398" text-anchor="middle" font-size="9" fill="#f59e0b" font-family="Arial" font-weight="bold">ALWAYS VERIFY COMPANY!</text>
  </g>

  <!-- Card 5: Crypto / Gift Card Payment -->
  <g filter="url(#cardShadow)">
    <rect x="290" y="255" width="220" height="155" rx="14" fill="url(#cardRed)"/>
    <rect x="290" y="255" width="220" height="6" rx="14 14 0 0" fill="#ef4444"/>
    <text x="400" y="300" text-anchor="middle" font-size="38" fill="#fff">₿</text>
    <text x="400" y="330" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial" font-weight="bold">Shady Payment Method</text>
    <text x="400" y="348" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">Asks for cryptocurrency,</text>
    <text x="400" y="362" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">gift cards, or wire transfer</text>
    <text x="400" y="398" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial" font-weight="bold">UNTRACEABLE = SCAM!</text>
  </g>

  <!-- Card 6: Build Trust then Fleece -->
  <g filter="url(#cardShadow)">
    <rect x="550" y="255" width="220" height="155" rx="14" fill="url(#cardRed)"/>
    <rect x="550" y="255" width="220" height="6" rx="14 14 0 0" fill="#ef4444"/>
    <text x="660" y="300" text-anchor="middle" font-size="38" fill="#fff">🪤</text>
    <text x="660" y="330" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial" font-weight="bold">Advance Fee Scam</text>
    <text x="660" y="348" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">Small payments first, then</text>
    <text x="660" y="362" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="Arial">suddenly bigger demands</text>
    <text x="660" y="398" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial" font-weight="bold">NEVER PAYS BACK!</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="422" width="800" height="28" fill="#7f1d1d" opacity="0.9"/>
  <text x="400" y="441" text-anchor="middle" font-size="12" fill="#fca5a5" font-family="Arial" font-weight="bold">If you spot ANY of these signs — STOP, BLOCK, and REPORT to cybercrime.gov.in</text>
</svg>

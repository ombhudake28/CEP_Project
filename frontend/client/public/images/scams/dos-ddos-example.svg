<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDosEx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="glowEx">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowEx">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgDosEx)"/>

  <!-- Terminal window mockup -->
  <rect x="80" y="30" width="640" height="380" rx="12" fill="url(#termGrad)" filter="url(#shadowEx)" stroke="#374151" stroke-width="1.5"/>

  <!-- Terminal title bar -->
  <rect x="80" y="30" width="640" height="34" rx="12" fill="#1f2937"/>
  <rect x="80" y="50" width="640" height="14" fill="#1f2937"/>
  <!-- Window controls -->
  <circle cx="104" cy="47" r="7" fill="#ef4444"/>
  <circle cx="124" cy="47" r="7" fill="#f59e0b"/>
  <circle cx="144" cy="47" r="7" fill="#22c55e"/>
  <text x="400" y="51" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Arial">Network Monitor — DDoS Alert</text>

  <!-- Terminal content -->
  <!-- Log lines showing attack -->
  <text x="100" y="88" font-size="11" fill="#6b7280" font-family="monospace">[00:00:01] INFO  — Server listening on port 80...</text>
  <text x="100" y="106" font-size="11" fill="#22c55e" font-family="monospace">[00:00:02] OK    — 25 normal requests/sec</text>

  <!-- Sudden spike -->
  <text x="100" y="128" font-size="11" fill="#f59e0b" font-family="monospace" filter="url(#glowEx)">[00:00:08] WARN  — Unusual traffic spike detected!</text>
  <text x="100" y="146" font-size="11" fill="#ef4444" font-family="monospace" filter="url(#glowEx)">[00:00:09] ALERT — 15,000 requests/sec from 2,300 IPs</text>
  <text x="100" y="164" font-size="11" fill="#ef4444" font-family="monospace" filter="url(#glowEx)">[00:00:10] ALERT — 48,000 requests/sec from 8,900 IPs</text>
  <text x="100" y="182" font-size="11" fill="#dc2626" font-family="monospace" font-weight="bold" filter="url(#glowEx)">[00:00:11] CRIT  — CPU 100% — Memory 100% — OVERLOADED!</text>

  <!-- Server crashing output -->
  <text x="100" y="204" font-size="11" fill="#dc2626" font-family="monospace" filter="url(#glowEx)">[00:00:12] ERROR — Connection timeout for all clients</text>
  <text x="100" y="222" font-size="11" fill="#dc2626" font-family="monospace" filter="url(#glowEx)">[00:00:13] ERROR — HTTP 503 Service Unavailable</text>
  <text x="100" y="240" font-size="11" fill="#dc2626" font-family="monospace" filter="url(#glowEx)">[00:00:14] FATAL — Server process killed (OOM)</text>

  <!-- Blinking cursor indicator -->
  <rect x="100" y="252" width="420" height="2" fill="#ef4444" opacity="0.5"/>

  <!-- Attacker's perspective (bottom half) -->
  <text x="100" y="275" font-size="10" fill="#6b7280" font-family="monospace">── Attacker's Botnet Command ──────────────────────────</text>
  <text x="100" y="294" font-size="11" fill="#a78bfa" font-family="monospace">$ hping3 -S --flood -p 80 target-website.com</text>
  <text x="100" y="312" font-size="11" fill="#a78bfa" font-family="monospace">$ ddos-tool --zombies 10000 --rate 100000 target.com</text>

  <text x="100" y="334" font-size="10" fill="#6b7280" font-family="monospace">── Impact ─────────────────────────────────────────────</text>
  <text x="100" y="352" font-size="11" fill="#fca5a5" font-family="monospace">✗ Website DOWN for all legitimate users</text>
  <text x="100" y="370" font-size="11" fill="#fca5a5" font-family="monospace">✗ Business losses: ₹Lakhs per hour of downtime</text>
  <text x="100" y="388" font-size="11" fill="#fca5a5" font-family="monospace">✗ Customer data: at risk during the chaos</text>

  <!-- Right-side annotation -->
  <g filter="url(#glowEx)">
    <line x1="635" y1="155" x2="635" y2="155" stroke="#ef4444" stroke-width="1"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="425" width="800" height="25" fill="#7f1d1d" opacity="0.9"/>
  <text x="400" y="442" text-anchor="middle" font-size="11" fill="#fef2f2" font-family="Arial" font-weight="bold">⚠ Real DDoS attacks can knock banks, hospitals and govt sites offline for hours</text>
</svg>
